<script>
    function generateAndDownloadICS() {
        // 1. Define the survey URL and event details
        const surveyUrl = "https://www.yoursurvey.com/msk-pain-score";
        const eventTitle = "Follow-up Pain Survey";
        const eventDescription = "Please fill out your follow-up pain survey here: " + surveyUrl;
        
        // 2. Calculate dates (Current time + 28 days)
        const now = new Date();
        const futureDate = new Date(now.getTime() + (28 * 24 * 60 * 60 * 1000));
        const futureEndDate = new Date(futureDate.getTime() + (1 * 60 * 60 * 1000));

        // 3. Format dates for the .ics standard
        function formatICSDate(date) {
            const pad = n => n < 10 ? '0' + n : n;
            return date.getUTCFullYear() +
                   pad(date.getUTCMonth() + 1) +
                   pad(date.getUTCDate()) + 'T' +
                   pad(date.getUTCHours()) +
                   pad(date.getUTCMinutes()) +
                   pad(date.getUTCSeconds()) + 'Z';
        }

        const dtStamp = formatICSDate(now);
        const dtStart = formatICSDate(futureDate);
        const dtEnd = formatICSDate(futureEndDate);

        // 4. Build the .ics file content string (VALARM block removed for mobile compliance)
        const icsContent = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Post-Procedure Reminder//EN",
            "CALSCALE:GREGORIAN",
            "BEGIN:VEVENT",
            "UID:" + now.getTime() + "@reminder.local",
            "DTSTAMP:" + dtStamp,
            "DTSTART:" + dtStart,
            "DTEND:" + dtEnd,
            "SUMMARY:" + eventTitle,
            "DESCRIPTION:" + eventDescription,
            "URL:" + surveyUrl,
            "END:VEVENT",
            "END:VCALENDAR"
        ].join("\r\n");

        // 5. Mobile-friendly delivery logic
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        if (isIOS) {
            // iOS Safari prefers direct data URIs to trigger Apple Calendar
            window.location.href = "data:text/calendar;charset=utf8," + encodeURIComponent(icsContent);
        } else {
            // Standard download for Android and Desktop
            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'survey-reminder.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }
    }
</script>
